name: ClassicPress Directory Coding Standard checks.

on: [pull_request, push]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phpcs:
      name: CPCS
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v6
        - name: CPCS get rules
          run: |
            wget https://raw.githubusercontent.com/ClassicPress/ClassicPress-Coding-Standards/main/phpcs.xml
            sed -i '/^\t<!-- start config -->.*/a\
              <file>.</file>
              ' phpcs.xml
            sed -i '/MY_DOMAIN/ s//fx-builder-widgets/' phpcs.xml
            mv phpcs.xml phpcs.xml.dist
        - name: CPCS checks
          uses: 10up/wpcs-action@v1.7.0
          with:
            use_local_config: 'true'
            enable_warnings: 'true'
            # Standalone dependency doubles are exercised by the rendering job.
            extra_args: '--ignore=*/tests/* --report-json=./phpcs.json'
        - name: Update summary
          run: |
            npm i -g github:10up/phpcs-json-to-md
            phpcs-json-to-md --path ./phpcs.json --output ./phpcs.md
            cat phpcs.md >> $GITHUB_STEP_SUMMARY
          if: always()

  rendering:
    name: Widget rendering regression tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Test with and without the optional FX Shortcodes parser
        run: |
          php tests/widget-rendering.php
          php tests/widget-rendering.php --with-fx-shortcodes
